<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Sharon &amp; Steven — Save the Date</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Mrs+Saint+Delafield&family=Permanent+Marker&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #f8f1e2;
    --cream-deep: #efe4c9;
    --paper: #fdfaf3;
    --envelope: #f6efdf;
    --envelope-shade: #e9dcc0;
    --ink: #3a352c;
    --ink-soft: #6b6353;
    --sage: #6f8f74;
    --sage-deep: #4f6b53;
    --blossom: #e3b7bd;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh; min-height:100dvh;
    background: var(--cream);
    font-family:'Jost', sans-serif;
    color: var(--ink);
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .stage{
    width:100%; max-width:480px;
    height:100vh; height:100dvh; max-height:920px;
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    perspective:1800px;
  }

  /* ---------------- pre-open cursive hint ---------------- */
  .pre-hint{
    position:absolute;
    top:14%;
    left:0; right:0;
    text-align:center;
    font-family:'Mrs Saint Delafield', cursive;
    font-size:clamp(26px,7vw,34px);
    color: var(--sage-deep);
    z-index:6;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .pre-hint.hidden{ opacity:0; transform: translateY(-10px); pointer-events:none; }

  /* ---------------- scene ---------------- */
  .scene{
    position:relative;
    width:80%; max-width:340px;
    aspect-ratio: 108 / 86;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------------- envelope ---------------- */
  .envelope{
    position:absolute;
    left:50%; top:50%;
    width:100%;
    aspect-ratio: 3 / 2.05;
    transform: translate(-50%,-50%);
    transition: transform 0.9s cubic-bezier(.5,0,.3,1);
    cursor:pointer;
    z-index:5;
    filter: drop-shadow(0 18px 34px rgba(60,45,25,0.22));
  }
  .envelope.opened{
    transform: translate(-50%, 6%) scale(0.86);
    z-index:1;
    cursor:default;
  }
  .env-body{
    position:absolute; inset:0;
    background: linear-gradient(160deg, var(--envelope) 0%, var(--envelope-shade) 100%);
    border-radius:3px;
  }
  .env-body::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.35) 50%, transparent 100%);
    opacity:0.4;
  }
  .env-liner{
    position:absolute; inset:8% 7%;
    border:1px solid rgba(90,75,50,0.18);
  }
  .env-header{
    position:absolute;
    left:0; right:0; top:14%;
    text-align:center;
    transition: opacity 0.4s ease;
  }
  .envelope.opened .env-header{ opacity:0; }
  .env-header .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color: var(--ink-soft);
  }
  .env-header .names{
    margin-top:4px;
    font-family:'Mrs Saint Delafield', cursive;
    font-size:clamp(24px,6.4vw,30px);
    color: var(--ink);
  }
  .env-flap{
    position:absolute;
    top:0; left:0; right:0;
    height:64%;
    transform-origin: top center;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(.6,.02,.35,1);
    z-index:3;
  }
  .envelope.opened .env-flap{ transform: rotateX(178deg); }
  .env-flap svg{ width:100%; height:100%; display:block; overflow:visible; }
  .seal{
    position:absolute;
    left:50%; top:58%;
    transform:translate(-50%,-50%);
    width:15%;
    z-index:4;
    filter: drop-shadow(0 3px 5px rgba(60,45,25,0.3));
    transition: transform 0.5s ease, opacity 0.35s ease;
  }
  .envelope.opened .seal{ transform:translate(-50%,-50%) scale(0.5) rotate(20deg); opacity:0; }

  /* ---------------- card stack ---------------- */
  .stack{
    position:absolute; inset:0;
    z-index:10;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.4s ease 0.3s;
    touch-action: pan-y;
  }
  .stack.visible{ opacity:1; pointer-events:auto; }

  .card{
    position:absolute; inset:0;
    background: var(--paper);
    border-radius:5px;
    box-shadow: 0 16px 30px rgba(60,45,25,0.28);
    display:flex; flex-direction:column;
    overflow:hidden;
    transition: transform 0.5s cubic-bezier(.22,.61,.36,1), opacity 0.4s ease;
    user-select:none;
  }
  .card.dragging{ transition:none; }
  .card.flying-back{ transition: transform 0.55s cubic-bezier(.22,.61,.36,1); }
  .card.flying-fwd{ transition: transform 0.55s cubic-bezier(.22,.61,.36,1); }

  /* postcard */
  .postcard{ padding:6%; background: #f6efe1; }
  .postcard-art{
    flex:1; width:100%; overflow:hidden;
    border:1px solid rgba(90,75,50,0.35);
    box-shadow: inset 0 0 0 4px #f6efe1, inset 0 0 0 5px rgba(90,75,50,0.25);
  }
  .postcard-caption{
    text-align:center;
    padding-top:5%;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(19px,5.6vw,24px);
    color: var(--ink);
    letter-spacing:0.01em;
  }

  /* polaroid — real Instax Wide proportions: image 99x62mm inside 108x86mm card */
  .polaroid{
    background: #f2ead9;
    padding:4.5% 4.2% 0 4.2%;
    box-shadow: inset 0 0 0 1px rgba(90,75,50,0.08);
  }
  .polaroid .photo-frame{
    width:100%;
    aspect-ratio: 99/62;
    overflow:hidden;
    background:#e9e2d2;
    box-shadow: inset 0 0 8px rgba(40,30,15,0.35), inset 0 0 0 1px rgba(0,0,0,0.15);
    position:relative;
    flex-shrink:0;
  }
  .polaroid .photo-frame img{
    width:100%; height:100%; object-fit:cover; display:block;
    filter: sepia(0.18) saturate(0.85) contrast(0.96) brightness(1.02);
  }
  .polaroid .photo-frame::after{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(60,45,25,0.16) 100%);
    pointer-events:none;
  }
  .polaroid .caption-zone{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    min-height:0;
    overflow:hidden;
  }
  .caption-zone .handwrite{
    font-family:'Permanent Marker', cursive;
    font-size:clamp(13px,4.4vw,18px);
    color:#2f2b25;
    transform: rotate(-1.2deg);
    white-space:nowrap;
  }

  /* stack fan offsets applied via JS transform */

  /* ---------------- controls ---------------- */
  .dots{
    position:absolute;
    bottom:-30px; left:0; right:0;
    display:flex; justify-content:center; gap:7px;
    z-index:20;
  }
  .dot{ width:6px; height:6px; border-radius:50%; background: rgba(79,107,83,0.25); transition: background 0.3s, transform 0.3s; }
  .dot.active{ background: var(--sage-deep); transform:scale(1.3); }

  .nav-arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    width:34px; height:34px; border-radius:50%;
    background: rgba(255,255,255,0.6);
    border:1px solid rgba(79,107,83,0.3);
    color: var(--sage-deep);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:25; font-size:15px;
  }
  .nav-arrow.prev{ left:-44px; } .nav-arrow.next{ right:-44px; }
  @media (max-width:480px){ .nav-arrow{ display:none; } }

  .actions{
    position:absolute;
    bottom:-108px; left:0; right:0;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    opacity:0; transform: translateY(6px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events:none;
    z-index:20;
  }
  .actions.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .cal-row{ display:flex; gap:10px; }
  .btn{
    font-family:'Jost', sans-serif;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-size:10.5px;
    text-decoration:none;
    color: var(--paper);
    background: var(--sage-deep);
    border:none;
    padding:10px 16px;
    border-radius:2px;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn.ghost{
    background: transparent;
    color: var(--sage-deep);
    border:1px solid var(--sage-deep);
  }
  .btn.rsvp{
    padding:12px 30px;
    font-size:11.5px;
    box-shadow:0 6px 16px rgba(60,45,25,0.18);
  }
</style>
</head>
<body>

<div class="stage">
  <div class="pre-hint" id="preHint">You've got a love letter</div>

  <div class="scene">
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open envelope">
      <div class="env-body">
        <div class="env-liner"></div>
        <div class="env-header">
          <div class="eyebrow">A Love Letter From</div>
          <div class="names">Sharon &amp; Steven</div>
        </div>
      </div>
      <div class="env-flap">
        <svg viewBox="0 0 300 175" preserveAspectRatio="none">
          <defs>
            <linearGradient id="flapG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f8f1e2"/>
              <stop offset="100%" stop-color="#ecdfc0"/>
            </linearGradient>
          </defs>
          <path d="M0,0 L300,0 L300,4 L152,148 Q150,152 148,148 L0,4 Z"
                fill="url(#flapG)"/>
          <path d="M0,4 L148,148" fill="none" stroke="#d8c8a0" stroke-width="0.8" opacity="0.6"/>
          <path d="M300,4 L152,148" fill="none" stroke="#d8c8a0" stroke-width="0.8" opacity="0.6"/>
        </svg>
      </div>
      <svg class="seal" viewBox="0 0 80 100">
        <ellipse cx="40" cy="50" rx="36" ry="46" fill="#efe4c9" stroke="#c9b98f" stroke-width="1.5"/>
        <ellipse cx="40" cy="50" rx="30" ry="40" fill="none" stroke="#c9b98f" stroke-width="0.8"/>
        <path d="M40,30 C34,38 30,44 34,52 C37,58 44,58 40,68" fill="none" stroke="#8a9b7f" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="34" cy="42" r="3" fill="#a6b89a"/>
        <circle cx="46" cy="48" r="2.4" fill="#a6b89a"/>
        <text x="40" y="88" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="12" letter-spacing="2" fill="#7a6c4e">S &amp; S</text>
      </svg>
    </div>

    <div class="stack" id="stack">
      <!-- 0: postcard -->
      <div class="card postcard" data-key="postcard">
        <div class="postcard-art">
          <svg viewBox="0 0 300 190" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;">
            <defs>
              <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#f0dcd6"/>
                <stop offset="55%" stop-color="#ecdfd8"/>
                <stop offset="100%" stop-color="#e3ddd0"/>
              </linearGradient>
              <linearGradient id="fujiG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#96a6a8"/>
                <stop offset="100%" stop-color="#6d7f83"/>
              </linearGradient>
              <linearGradient id="hillG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#a3ab8f"/>
                <stop offset="100%" stop-color="#83907a"/>
              </linearGradient>
              <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
                <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise"/>
                <feColorMatrix in="noise" type="matrix"
                  values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.05 0"/>
              </filter>
              <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="1.6"/>
              </filter>
              <radialGradient id="vig" cx="50%" cy="40%" r="80%">
                <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
                <stop offset="100%" stop-color="#4a3a26" stop-opacity="0.14"/>
              </radialGradient>
            </defs>

            <rect width="300" height="190" fill="url(#skyG)"/>
            <circle cx="150" cy="55" r="30" fill="#f7f1e6" opacity="0.65" filter="url(#softBlur)"/>

            <!-- soft rolling hill, blurred for depth -->
            <path filter="url(#softBlur)" d="M-10,120 Q50,102 120,114 Q165,122 215,108 Q255,98 310,112 L310,190 L-10,190 Z"
                  fill="url(#hillG)" opacity="0.9"/>

            <!-- fuji: single smooth curve, no straight triangle edges -->
            <path d="M70,120
                     C 85,95 105,65 150,28
                     C 195,65 215,95 230,120
                     C 205,113 178,110 150,110
                     C 122,110 95,113 70,120 Z"
                  fill="url(#fujiG)"/>
            <path d="M150,28 C 160,42 168,55 172,68
                     C 165,73 158,75 150,75
                     C 142,75 135,73 128,68
                     C 132,55 140,42 150,28 Z"
                  fill="#f7f1e6"/>
            <path d="M178,85 C 200,98 218,110 230,120 C 208,113 184,110 158,110 Z"
                  fill="#48555a" opacity="0.35"/>

            <!-- cherry blossom branch -->
            <g opacity="0.95">
              <path d="M-5,32 C20,25 36,36 52,20" stroke="#8a7160" stroke-width="2.2" fill="none" stroke-linecap="round"/>
              <g fill="#e3aeb6">
                <ellipse cx="12" cy="28" rx="5.5" ry="4.4" transform="rotate(-10 12 28)"/>
                <ellipse cx="21" cy="21" rx="5" ry="4" transform="rotate(15 21 21)"/>
                <ellipse cx="30" cy="30" rx="6" ry="4.8" transform="rotate(-5 30 30)"/>
                <ellipse cx="39" cy="18" rx="4.6" ry="3.8" transform="rotate(20 39 18)"/>
              </g>
              <g fill="#eec9ce" opacity="0.85">
                <ellipse cx="5" cy="24" rx="3" ry="2.3"/>
                <ellipse cx="46" cy="27" rx="2.8" ry="2.1"/>
              </g>
            </g>
            <g fill="#e3aeb6" opacity="0.7">
              <ellipse cx="85" cy="45" rx="3" ry="1.9" transform="rotate(30 85 45)"/>
              <ellipse cx="245" cy="38" rx="2.6" ry="1.7" transform="rotate(-20 245 38)"/>
              <ellipse cx="258" cy="62" rx="3" ry="1.9" transform="rotate(15 258 62)"/>
            </g>

            <rect width="300" height="190" filter="url(#grain)"/>
            <rect width="300" height="190" fill="url(#vig)"/>
          </svg>
        </div>
        <div class="postcard-caption">We're getting married</div>
      </div>

      <div class="nav-arrow next" id="nextArrow">&#10095;</div>
      <div class="dots" id="dots"></div>

    <div class="actions" id="actions">
      <div class="cal-row">
        <a class="btn ghost" id="googleCal" target="_blank" rel="noopener">+ Google Calendar</a>
        <a class="btn ghost" id="appleCal" download="sharon-and-steven-wedding.ics">+ Apple Calendar</a>
      </div>
      <button class="btn rsvp" id="rsvpBtn">RSVP</button>
    </div>

<script>
(function(){
  const preHint = document.getElementById('preHint');
  const envelope = document.getElementById('envelope');
  const stack = document.getElementById('stack');
  const dotsWrap = document.getElementById('dots');
  const prevArrow = document.getElementById('prevArrow');
  const nextArrow = document.getElementById('nextArrow');
  const actions = document.getElementById('actions');

  let order = Array.from(stack.querySelectorAll('.card')); // order[0] = front
  const total = order.length;
  let opened = false;

  order.forEach(() => {
    const d = document.createElement('div');
    d.className = 'dot';
    dotsWrap.appendChild(d);
  });
  const dots = Array.from(dotsWrap.children);

  function layoutStack(animateClass){
    order.forEach((card, i) => {
      if (animateClass) card.classList.add(animateClass);
      if (i === 0){
        card.style.transform = 'translate(0,0) rotate(0deg) scale(1)';
        card.style.zIndex = 40;
        card.style.opacity = '1';
        card.style.pointerEvents = opened ? 'auto' : 'none';
      } else if (i < 4) {
        const dir = i % 2 === 0 ? 1 : -1;
        card.style.transform = `translate(${dir*4*i}px, ${6*i}px) rotate(${dir*1.4*i}deg) scale(${1 - i*0.035})`;
        card.style.zIndex = 40 - i;
        card.style.opacity = '1';
        card.style.pointerEvents = 'none';
      }
    });
    dots.forEach((d,i) => d.classList.toggle('active', order[0] === Array.from(stack.querySelectorAll('.card'))[i] ? true : false));
    // recompute active dot by original index
    const originalOrder = Array.from(stack.querySelectorAll('.card'));
    const frontOriginalIndex = originalOrder.indexOf(order[0]);
    dots.forEach((d,i) => d.classList.toggle('active', i === frontOriginalIndex));

    if (animateClass){
      setTimeout(() => order.forEach(c => c.classList.remove(animateClass)), 560);
    }
  }

  function goNext(){
    if (!opened) return;
    const front = order[0];
    front.style.transform = 'translate(-140%, -10%) rotate(-14deg) scale(0.9)';
    front.style.opacity = '0.4';
    order.push(order.shift());
    setTimeout(() => layoutStack(), 260);
  }

  function goPrev(){
    if (!opened) return;
    order.unshift(order.pop());
    const incoming = order[0];
    incoming.style.transition = 'none';
    incoming.style.transform = 'translate(140%, -10%) rotate(14deg) scale(0.9)';
    incoming.style.opacity = '0.4';
    // force reflow then animate in
    void incoming.offsetWidth;
    incoming.style.transition = '';
    layoutStack();
  }

  prevArrow.addEventListener('click', goPrev);
  nextArrow.addEventListener('click', goNext);

  // swipe / drag on front card
  let startX = 0, deltaX = 0, dragging = false;

  function onStart(x){
    if (!opened) return;
    dragging = true; startX = x; deltaX = 0;
    order[0].classList.add('dragging');
  }
  function onMove(x){
    if (!dragging) return;
    deltaX = x - startX;
    order[0].style.transform = `translateX(${deltaX}px) rotate(${deltaX*0.04}deg)`;
  }
  function onEnd(){
    if (!dragging) return;
    dragging = false;
    order[0].classList.remove('dragging');
    const threshold = 55;
    if (deltaX < -threshold){ goNext(); }
    else if (deltaX > threshold){ goPrev(); }
    else { layoutStack(); }
  }

  stack.addEventListener('touchstart', e => onStart(e.touches[0].clientX), {passive:true});
  stack.addEventListener('touchmove', e => onMove(e.touches[0].clientX), {passive:true});
  stack.addEventListener('touchend', onEnd);
  stack.addEventListener('mousedown', e => { e.preventDefault(); onStart(e.clientX); });
  window.addEventListener('mousemove', e => onMove(e.clientX));
  window.addEventListener('mouseup', onEnd);

  function openEnvelope(){
    if (opened) return;
    opened = true;
    preHint.classList.add('hidden');
    envelope.classList.add('opened');
    stack.classList.add('visible');
    setTimeout(() => {
      layoutStack();
      actions.classList.add('show');
    }, 420);
  }
  envelope.addEventListener('click', openEnvelope);
  envelope.addEventListener('keypress', e => { if (e.key === 'Enter' || e.key === ' ') openEnvelope(); });

  // initial (closed / pre-open) layout so cards sit neatly before reveal
  layoutStack();

  // ---- calendar links ----
  const eventTitle = "Sharon & Steven's Wedding";
  const eventDetails = "More details to follow.";
  const startDate = "20271120";
  const endDate = "20271121";

  document.getElementById('googleCal').href =
    `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(eventTitle)}&dates=${startDate}/${endDate}&details=${encodeURIComponent(eventDetails)}`;

  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Sharon and Steven//Wedding//EN',
    'BEGIN:VEVENT',
    `UID:${Date.now()}@sharonandsteven`,
    `DTSTART;VALUE=DATE:${startDate}`,
    `DTEND;VALUE=DATE:${endDate}`,
    `SUMMARY:${eventTitle}`,
    `DESCRIPTION:${eventDetails}`,
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  document.getElementById('appleCal').href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);

  document.getElementById('rsvpBtn').addEventListener('click', () => {
    alert('RSVP link goes here — swap this href for your RSVP form URL.');
  });
})();
</script>
</body>
</html>
